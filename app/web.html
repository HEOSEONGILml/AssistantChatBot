<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>강아지</title>
  </head>
  <body class="web">
    <canvas id="stage"></canvas>
    <div id="bubble" hidden></div>
    <div id="talkbar" hidden>
      <input id="talk" placeholder="강아지에게 말 걸기 (Enter 보내기, Esc 닫기)" autocomplete="off" />
    </div>
    <aside id="panel" hidden>
      <header><strong>강아지 설정</strong><button id="panel-close" aria-label="닫기">✕</button></header>
      <nav>
        <button data-tab="settings" class="on">설정</button>
        <button data-tab="status">상태</button>
        <button data-tab="log">로그</button>
      </nav>
      <section id="tab-settings" class="tab">
        <p>AI 상태: <span id="ai-state">연결 중…</span></p>
        <label>TypeSafe(Jev) 키 <input id="typesafe" type="password" placeholder="새 키 입력" /></label>
        <label>Gemini 키 <input id="gemini" type="password" placeholder="새 키 입력" /></label>
        <button id="save-keys">키 저장</button>
        <label><input type="checkbox" id="rest" /> 쉬기 — 그 자리에서 잠만 자요</label>
        <label><input type="checkbox" id="hideHouseWhenInside" /> 강아지가 집에 있을 때 집도 숨기기</label>
        <button id="clear-history">대화 기록 전체 삭제</button>
        <button id="reset">초기화 (강아지 새로 태어나기)</button>
        <p id="msg" role="status"></p>
      </section>
      <section id="tab-status" class="tab" hidden><pre>불러오는 중…</pre></section>
      <section id="tab-log" class="tab" hidden><pre>불러오는 중…</pre></section>
    </aside>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
