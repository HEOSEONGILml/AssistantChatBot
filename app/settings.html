<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>강아지 설정</title>
  </head>
  <body>
    <main style="font: 14px 'Malgun Gothic', sans-serif; padding: 16px; display: grid; gap: 12px;">
      <label>움직임 정도
        <select id="activity">
          <option value="rest">쉬기 — 거의 한 자리에서 쉬어요 (집중할 때)</option>
          <option value="calm">차분</option>
          <option value="normal">보통</option>
          <option value="lively">활발</option>
        </select>
      </label>
      <label><input type="checkbox" id="inputAlwaysVisible" /> 입력창 항상 표시</label>
      <label><input type="checkbox" id="hideHouseWhenInside" /> 강아지가 집에 있을 때 집도 숨기기</label>
      <label>입력창 단축키 <input id="inputShortcut" /></label>
      <label>강아지 집 단축키 <input id="houseShortcut" /></label>
      <fieldset><legend>TypeSafe(Jev) 키 <span id="typesafe-state"></span></legend>
        <input id="typesafe" type="password" placeholder="새 키 입력" /> <button data-del="typesafe">삭제</button></fieldset>
      <fieldset><legend>Gemini 키 <span id="gemini-state"></span></legend>
        <input id="gemini" type="password" placeholder="새 키 입력" /> <button data-del="gemini">삭제</button></fieldset>
      <button id="save">저장</button>
      <p id="msg" role="status"></p>
    </main>
    <script type="module" src="/src/settings-page.ts"></script>
  </body>
</html>
