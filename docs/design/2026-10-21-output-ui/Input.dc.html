<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
.dog{width:128px;height:96px;background-image:url(../../../app/public/sprites/dog/dog-02.png);background-size:1024px 864px;background-repeat:no-repeat;image-rendering:pixelated}
.p-stand{background-position:0 0}

</style>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: #20242C"></div>
<section aria-label="새 작업" style="position: absolute; right: 20px; bottom: 156px; width: 340px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D5DAE1; border-radius: 14px; box-shadow: 0 10px 28px rgba(20, 24, 32, 0.18); display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 4px; padding: 0 4px; border-bottom: 1px solid #E6E9EE">

</div>
<form style="padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 8px">
<label for="newreq" style="font-size: 12px; font-weight: 700; color: #5B6472">무엇을 할까요?</label>
<textarea id="newreq" placeholder="예: 아까 슬랙에서 본 링크, 카톡으로 민지한테 보내 줘" style="height: 160px; box-sizing: border-box; padding: 9px 12px; border: 2px solid #1D4ED8; border-radius: 10px; font: inherit; font-size: 13px; line-height: 20px; color: #1B1F27; outline: none; resize: none; overflow-y: auto">아까 슬랙 #마케팅 채널에서 본 랜딩 페이지 시안 링크 있잖아. 그거 카톡으로 민지한테 보내 주고, 보낼 때 "금요일 회의 전에 한번 봐 줘, 특히 첫 화면 문구랑 가격표 부분 의견 부탁해"라고 같이 적어 줘. 민지가 단톡방에만 있으면 개인 대화로 보내 줘.</textarea>
<div style="display: flex; align-items: center; gap: 6px">
<span style="flex: 1; font-size: 11px; color: #5B6472">Enter 보내기 · Shift+Enter 줄바꿈</span>
<a href="TaskPanel.dc.html" style="min-height: 40px; padding: 0 16px; display: flex; align-items: center; border: 1px solid #C4CAD3; border-radius: 10px; color: #1B1F27; font-size: 13px; font-weight: 500; text-decoration: none">취소</a>
<button type="submit" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: #1D4ED8; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">맡기기</button>
</div>
</form>
<div aria-hidden="true" style="position: absolute; right: 56px; bottom: -8px; width: 14px; height: 14px; background: #FFFFFF; border-right: 1px solid #D5DAE1; border-bottom: 1px solid #D5DAE1; transform: rotate(45deg)"></div>
</section>
<a href="Main.dc.html" aria-label="작업 패널 닫기" style="position: absolute; right: 20px; bottom: 48px; display: block; width: 128px; height: 96px"><span class="dog p-stand" style="display: block"></span></a>
