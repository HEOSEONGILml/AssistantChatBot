<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>새 스케줄</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
.dog{width:128px;height:96px;background-image:url(../../../app/public/sprites/dog/dog-02.png);background-size:1024px 864px;background-repeat:no-repeat;image-rendering:pixelated}
.p-sit{background-position:0 -96px}
input::placeholder,textarea::placeholder{color:#6B7280}
</style>
</helmet>
<div style="width: 440px; height: 640px; position: relative; overflow: hidden; background: #E6E9EE; font-family: 'Noto Sans KR', sans-serif; color: #1B1F27">
<div aria-hidden="true" style="position: absolute; left: 24px; top: 24px; right: -40px; bottom: 80px; background: #F7F8FA; border: 1px solid #D5DAE1; border-radius: 10px"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: #20242C"></div>
<section aria-label="새 스케줄" style="position: absolute; right: 20px; bottom: 156px; width: 340px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D5DAE1; border-radius: 14px; box-shadow: 0 10px 28px rgba(20, 24, 32, 0.18); display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 4px; padding: 0 4px; border-bottom: 1px solid #E6E9EE">
<a href="SchedulePanel.dc.html" aria-label="스케줄 목록으로" style="flex: none; width: 44px; height: 44px; color: #1B1F27; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="flex: 1; font-size: 14px; font-weight: 700">새 스케줄</span>
</div>
<form style="padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="sname" style="font-size: 12px; font-weight: 700; color: #5B6472">이름</label>
<input id="sname" type="text" value="주간 보고서 업로드" placeholder="예: 메일 요약" style="height: 40px; box-sizing: border-box; padding: 0 10px; border: 1px solid #C4CAD3; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; color: #1B1F27">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; gap: 8px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<label for="srepeat" style="font-size: 12px; font-weight: 700; color: #5B6472">반복</label>
<select id="srepeat" style="height: 40px; box-sizing: border-box; padding: 0 10px; border: 1px solid #C4CAD3; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; color: #1B1F27"><option>매일</option><option>평일</option><option selected>매주</option><option>매월</option><option>한 번</option></select>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<label for="stime" style="font-size: 12px; font-weight: 700; color: #5B6472">시각</label>
<input id="stime" type="time" value="10:30" style="height: 40px; box-sizing: border-box; padding: 0 10px; border: 1px solid #C4CAD3; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; color: #1B1F27">
</div>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; gap: 4px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">요일</legend>
<label style="flex: 1; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #1D4ED8; color: #FFFFFF; border: 1px solid #1D4ED8; font-size: 12px; font-weight: 500; cursor: pointer"><input type="checkbox" name="days" value="월" checked style="position: absolute; opacity: 0; width: 1px; height: 1px">월</label>
<label style="flex: 1; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #FFFFFF; color: #1B1F27; border: 1px solid #C4CAD3; font-size: 12px; font-weight: 500; cursor: pointer"><input type="checkbox" name="days" value="화" style="position: absolute; opacity: 0; width: 1px; height: 1px">화</label>
<label style="flex: 1; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #FFFFFF; color: #1B1F27; border: 1px solid #C4CAD3; font-size: 12px; font-weight: 500; cursor: pointer"><input type="checkbox" name="days" value="수" style="position: absolute; opacity: 0; width: 1px; height: 1px">수</label>
<label style="flex: 1; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #FFFFFF; color: #1B1F27; border: 1px solid #C4CAD3; font-size: 12px; font-weight: 500; cursor: pointer"><input type="checkbox" name="days" value="목" style="position: absolute; opacity: 0; width: 1px; height: 1px">목</label>
<label style="flex: 1; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #FFFFFF; color: #1B1F27; border: 1px solid #C4CAD3; font-size: 12px; font-weight: 500; cursor: pointer"><input type="checkbox" name="days" value="금" style="position: absolute; opacity: 0; width: 1px; height: 1px">금</label>
<label style="flex: 1; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #FFFFFF; color: #1B1F27; border: 1px solid #C4CAD3; font-size: 12px; font-weight: 500; cursor: pointer"><input type="checkbox" name="days" value="토" style="position: absolute; opacity: 0; width: 1px; height: 1px">토</label>
<label style="flex: 1; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #FFFFFF; color: #1B1F27; border: 1px solid #C4CAD3; font-size: 12px; font-weight: 500; cursor: pointer"><input type="checkbox" name="days" value="일" style="position: absolute; opacity: 0; width: 1px; height: 1px">일</label>
</fieldset>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="sbody" style="font-size: 12px; font-weight: 700; color: #5B6472">할 일</label>
<textarea id="sbody" placeholder="무엇을 할지 적어 주세요" style="height: 96px; box-sizing: border-box; padding: 9px 12px; border: 1px solid #C4CAD3; border-radius: 10px; font: inherit; font-size: 13px; line-height: 20px; color: #1B1F27; resize: none; overflow-y: auto">지난주 작업 기록으로 주간 보고서를 쓰고 사내 드라이브 '주간 보고' 폴더에 올려 줘.</textarea>
</div>
<div style="display: flex; justify-content: flex-end; gap: 6px">
<a href="SchedulePanel.dc.html" style="min-height: 40px; padding: 0 16px; display: flex; align-items: center; border: 1px solid #C4CAD3; border-radius: 10px; color: #1B1F27; font-size: 13px; font-weight: 500; text-decoration: none">취소</a>
<button type="submit" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: #1D4ED8; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">등록</button>
</div>
</form>
<div aria-hidden="true" style="position: absolute; right: 56px; bottom: -8px; width: 14px; height: 14px; background: #FFFFFF; border-right: 1px solid #D5DAE1; border-bottom: 1px solid #D5DAE1; transform: rotate(45deg)"></div>
</section>
<a href="Main.dc.html" aria-label="작업 패널 닫기" style="position: absolute; right: 20px; bottom: 48px; display: block; width: 128px; height: 96px"><span class="dog p-sit" style="display: block"></span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":640}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
