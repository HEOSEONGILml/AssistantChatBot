# 웹 프로토타입: docker compose up -d --build → http://127.0.0.1:8787
# 키는 .env의 TYPESAFE_API_KEY, GEMINI_API_KEY (컨테이너엔 OS 자격 저장소가 없다)
services:
  web:
    build: .
    ports:
      - "8787:8787"  # 전체 공개. 키가 서버에 있어 주소를 아는 사람은 누구나 키를 쓴다 (0017)
    env_file:
      - path: .env
        required: false
    volumes:
      - brain-data:/data
    restart: unless-stopped
volumes:
  brain-data:
